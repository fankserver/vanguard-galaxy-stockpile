name: Validate owner-built release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag with owner-built VGStockpile.zip attached
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
      - run: gh release download "$TAG" --pattern 'VGStockpile.zip' --dir dist
      - run: python3 tools/package.py --check dist/VGStockpile.zip --tag "$TAG"
      - run: gh release download "$TAG" --pattern 'update.json' --dir dist
      - name: Feed must advertise this exact tag and identity
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          tag = os.environ["TAG"]
          feed = json.loads(pathlib.Path("dist/update.json").read_text())
          assert feed == {"schemaVersion": 1, "pluginId": "vgstockpile", "channel": "stable",
                          "version": tag.lstrip("v"),
                          "releaseUrl": "https://github.com/fankserver/vanguard-galaxy-stockpile/releases/tag/" + tag}, feed
          PY
